<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moksha Motorsports | Tests & Inspection Timeline</title>
<style>
:root{
  --bg:#080a0d;--panel:#12161c;--panel2:#171c24;--line:#252b34;--text:#f4f6f8;--muted:#9ba5b2;
  --green:#00b88a;--red:#ef4444;--purple:#a879df;--blue:#3b82f6;--amber:#f2b84b;
  --label-w:190px;--week-w:154px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:28px 28px}
a{color:inherit;text-decoration:none}
button{font:inherit}
.page{max-width:1900px;margin:0 auto;padding:0 30px 64px}
.top{min-height:108px;position:relative;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #1b2027;padding:0 0 20px;gap:20px}
.heading{padding-top:0;min-width:300px}
h1{margin:0;font-size:clamp(24px,2.35vw,39px);font-weight:950;letter-spacing:-1.4px;line-height:1.08;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:720px}
.updated{margin-top:13px;color:#f0f2f5;font-size:15px;font-weight:800;letter-spacing:.55px;text-transform:uppercase}
.nav{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;gap:5px;align-items:center;padding:5px;background:linear-gradient(180deg,#242831,#171b22);border:1px solid #303641;border-radius:40px;box-shadow:0 8px 24px #0008;z-index:2;white-space:nowrap}
.nav a{padding:11px 19px;border-radius:30px;font-size:14px;font-weight:900;letter-spacing:.2px;display:flex;gap:9px;align-items:center;color:#f3f4f6}
.nav a:hover{background:#333944}
.nav a.active{background:#f04448;box-shadow:0 3px 12px #ef444455}
.nav .ico{font-size:16px;opacity:.9}
.right-tools{display:flex;align-items:center;gap:12px;padding-top:8px}
.tool{height:42px;min-width:44px;border:1px solid #252c35;border-radius:14px;background:#141920;color:#e7ebef;display:flex;align-items:center;justify-content:center;font-size:18px}
.theme-dot{width:28px;height:28px;border-radius:50%;background:#ef4444;border:0;margin:0 4px}
.hero-meta{display:flex;gap:22px;justify-content:flex-end;align-items:center;padding:10px 2px 0;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.45px;text-transform:uppercase}
.hero-meta b{color:#fff;font-size:13px}
.legend{margin:22px 0 19px;background:#12161d;border:1px solid #242a34;border-radius:18px;padding:14px 22px;display:flex;align-items:center;gap:23px;overflow-x:auto;min-height:54px}
.legend-item{display:flex;gap:9px;align-items:center;white-space:nowrap;font-size:13px;font-weight:900;letter-spacing:.15px}
.swatch{width:14px;height:14px;border-radius:4px;border:1px solid currentColor;display:inline-block;flex:none}
.swatch.green{color:#007b60;background:#0e342d}.swatch.red{color:#923033;background:#2e171a}.swatch.active{color:#536176;background:transparent;border-style:dashed}.swatch.purple{color:#9a68cf;background:#b89bda}.swatch.buffer{color:#8d53c2;background:#332244}.swatch.planned{color:#333b47;background:#171c23}.swatch.blue{color:#2463a9;background:#102a4a}
.board{background:#12161c;border:1px solid #242a33;border-radius:23px;padding:27px 25px 23px;box-shadow:0 15px 40px #0003}
.board-title{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:0 0 15px}
.board-title h2{font-size:15px;font-weight:950;letter-spacing:.5px;text-transform:uppercase;margin:0}
.board-title small{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.timeline-scroll{overflow-x:auto;overflow-y:hidden;border:1px solid #242a32;border-radius:15px;scrollbar-color:#454c58 #171b21;scrollbar-width:thin}
.timeline{min-width:calc(var(--label-w) + 11 * var(--week-w));position:relative}.timeline-header,.workstream-row{display:grid;grid-template-columns:var(--label-w) repeat(11,var(--week-w));position:relative}.workstream-row{min-height:83px}.workstream-row .t-label{grid-column:1;grid-row:1;z-index:3}.workstream-row .t-cell{grid-row:1}.workstream-row .event{grid-row:1;align-self:center;height:calc(100% - 18px);position:relative;z-index:2}
.t-head{height:92px;background:#10141a;border-bottom:1px solid #292f38;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:9px 5px;position:relative}
.t-head.label-head{align-items:flex-start;padding-left:18px;font-size:13px;font-weight:950;text-transform:uppercase}
.t-head strong{font-size:15px;font-weight:950;line-height:1.15}
.t-head span{font-size:11px;line-height:1.2;font-weight:800;color:#d7dce3}
.t-head.active-week{border-left:2px dashed #677387;border-right:2px dashed #677387;background:#151a22}
.active-pill{position:absolute;top:8px;background:#8193aa;color:white;border-radius:14px;padding:3px 10px;font-size:9px!important;letter-spacing:.4px;font-weight:950}
.group-label{grid-column:1/-1;background:#181e27;color:#aeb8c5;font-size:10px;font-weight:950;letter-spacing:1px;padding:9px 15px;border-top:1px solid #343b46;border-bottom:1px solid #252b34;text-transform:uppercase}
.t-label,.t-cell{min-height:83px;border-bottom:1px solid #252b34;position:relative;background:#12161c}
.t-label{display:flex;flex-direction:column;justify-content:center;padding:12px 13px 12px 18px;position:sticky;left:0;z-index:1;background:#11151b;border-right:1px solid #272e38}
.t-label strong{font-size:13px;font-weight:900;line-height:1.25}
.t-label small{font-size:10px;line-height:1.35;color:#929eac;margin-top:6px}
.t-cell{border-right:1px solid #222933;background:rgba(255,255,255,.006)}
.t-cell.active-week{border-left:2px dashed #586679;border-right:2px dashed #586679;background:rgba(120,140,170,.025)}
.event{align-self:stretch;min-height:53px;margin:9px 5px;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding:8px 10px;min-width:0;border:1px solid transparent;z-index:0;overflow:hidden}
.event .event-title{font-size:12px;font-weight:900;line-height:1.25;display:flex;align-items:center;gap:7px}
.event .event-title:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.event small{font-size:10px;color:#c1c9d3;line-height:1.25;margin:4px 0 0 14px}
.event.completed{background:#0d2a26;border-color:#075b48;color:#00c396}
.event.overdue{background:#2b171a;border-color:#693034;color:#ff7479}
.event.planned{background:#171d25;border-color:#2c3542;color:#e5e9ee}
.event.buffer{background:#261d32;border-color:#69418b;color:#c5a2ec}
.event.target{background:#102544;border-color:#245b98;color:#7eb5ff}
.event.action{background:#2b171a;border-color:#693034;color:#ff7479}
.timeline-grid{display:contents}
.today-line{height:0;border-top:2px dashed #f2b84b;grid-column:5/6;z-index:4;pointer-events:none}
.notice{margin:13px 2px 0;color:#929eac;font-size:11px;line-height:1.45}
.section{margin-top:36px;scroll-margin-top:20px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:13px}
.section-head h2{margin:0;text-transform:uppercase;font-size:19px;font-weight:950;letter-spacing:.4px}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.pill{border:1px solid #303845;background:#151b23;padding:6px 10px;border-radius:20px;font-size:10px;font-weight:900;letter-spacing:.4px;color:#bdc6d2;white-space:nowrap}
.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:#12171e;border:1px solid #252c36;border-radius:14px;padding:15px 16px;min-height:108px}
.stat label{font-size:10px;letter-spacing:.7px;color:#9da8b6;font-weight:900;text-transform:uppercase}
.stat .value{font-size:27px;font-weight:950;margin:8px 0 2px;line-height:1}
.stat small{font-size:11px;color:#9da8b6}
.stat.good .value{color:#00c396}.stat.bad .value{color:#ff7479}.stat.info .value{color:#7eb5ff}.stat.warn .value{color:#f2b84b}
.progress-wrap{margin-top:13px;background:#202731;border-radius:20px;height:8px;overflow:hidden;display:flex}
.progress-wrap span{height:100%;display:block}
.progress-green{background:#00b88a}.progress-red{background:#ef4444}.progress-grey{background:#596575}
.data-table-wrap{overflow-x:auto;border:1px solid #28313c;border-radius:14px;background:#11161d}
table{border-collapse:collapse;width:100%;min-width:850px;font-size:12px}
th{background:#1d355b;color:#fff;text-align:left;font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.45px;padding:12px;border-right:1px solid #345078}
td{padding:11px 12px;border-top:1px solid #29313b;color:#dfe4eb;vertical-align:top;line-height:1.4}
td strong{color:#fff}td.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:800}
.status-text{font-weight:900;white-space:nowrap}.ok{color:#00c396}.fail{color:#ff7479}.pending{color:#aeb8c5}.review{color:#f2b84b}
.small-note{font-size:11px;color:#929eac;margin-top:10px;line-height:1.45}
.footer{margin-top:32px;padding:17px 0;border-top:1px solid #222a34;color:#7f8b99;font-size:10px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.loading,.error{margin:30px auto;max-width:600px;background:#171c24;border:1px solid #343d4a;border-radius:14px;padding:20px;color:#dce3eb}
@media(max-width:1050px){.page{padding:0 17px 45px}.top{padding-top:60px;min-height:150px}.nav{top:8px}.heading{padding-top:0}h1{max-width:100%;font-size:28px}.right-tools{display:none}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){:root{--label-w:155px;--week-w:135px}.page{padding:0 11px 35px}.top{padding-top:65px;min-height:145px}.nav{width:max-content;max-width:calc(100vw - 16px);overflow:auto}.nav a{font-size:11px;padding:10px 12px}.heading{min-width:0}.heading h1{font-size:21px;letter-spacing:-.6px}.updated{font-size:11px}.hero-meta{justify-content:flex-start;gap:12px;flex-wrap:wrap}.legend{padding:12px;gap:15px}.legend-item{font-size:11px}.board{padding:14px 11px}.board-title{align-items:flex-start;flex-direction:column}.summary-grid{gap:8px}.stat{padding:12px;min-height:95px}.stat .value{font-size:23px}.section-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="app" class="page"><div class="loading">Loading Moksha project timeline…</div></div>
<script>
(async function(){
  const mount=document.getElementById('app');
  const fmtDate=(iso)=>new Date(iso+'T00:00:00+05:30').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
  try{
    const response=await fetch('./admin-dashboard.json',{cache:'no-store'});
    if(!response.ok) throw new Error('Could not load admin-dashboard.json ('+response.status+'). Keep both files in the same folder.');
    const d=await response.json();
    const today=new Date(d.page.today+'T00:00:00+05:30');
    const deadline=new Date(d.page.targetDate+'T00:00:00+05:30');
    const daysLeft=Math.ceil((deadline-today)/86400000);
    const nav=d.navigation.map(n=>`<a href="${n.href}" class="${n.active?'active':''}"><span class="ico">${n.icon}</span>${n.label}</a>`).join('');
    const legend=d.legend.map(x=>`<div class="legend-item"><span class="swatch ${x.color}"></span>${x.label}</div>`).join('');
    const head=`<header class="top"><div class="heading"><h1>${d.page.title}</h1><div class="updated">LAST UPDATED: ${fmtDate(d.page.today)} · ${d.page.lastUpdated.slice(11,16)} IST</div></div><nav class="nav">${nav}</nav><div class="right-tools"><div class="tool" title="Refresh data">↻</div><div class="tool" title="Theme"><span style="font-size:12px;color:#a7b0bc">☼</span><span class="theme-dot"></span></div></div></header>`;
    const meta=`<div class="hero-meta"><span>TODAY <b>${fmtDate(d.page.today)}</b></span><span>DEADLINE <b>${d.page.targetLabel}</b></span><span><b>${daysLeft}</b> DAYS LEFT</span></div>`;
    const weekHead=d.weeks.map(w=>`<div class="t-head ${w.active?'active-week':''}">${w.active?'<span class="active-pill">ACTIVE</span>':''}<strong>${w.label}</strong><span>${w.date}</span></div>`).join('');
    let timeline=`<div class="timeline-scroll"><div class="timeline"><div class="timeline-header"><div class="t-head label-head">WORKSTREAM</div>${weekHead}</div>`;
    let group='';
    d.workstreams.forEach((w,i)=>{
      const newGroup=i===0?'TECHNICAL INSPECTION':i===2?'VEHICLE PERFORMANCE TESTS':i===d.workstreams.length-1?'FINAL READINESS':'';
      if(newGroup) timeline+=`<div class="group-label">${newGroup}</div>`;
      timeline+=`<div class="workstream-row"><div class="t-label"><strong>${w.name}</strong><small>${w.detail}</small></div>`;
      const rowEvents=w.events||[];
      const placed=rowEvents.map(ev=>{
        const start=d.weeks.findIndex(x=>x.number===ev.startWeek);
        const end=d.weeks.findIndex(x=>x.number===ev.endWeek);
        if(start<0||end<start) return '';
        const col=start+2,span=end-start+1;
        return `<div class="event ${ev.status}" style="grid-column:${col}/span ${span};grid-row:1" title="${ev.description.replace(/"/g,'&quot;')}"><div class="event-title">${ev.title}</div><small>${ev.description}</small></div>`;
      }).join('');
      const cells=d.weeks.map(w=>`<div class="t-cell ${w.active?'active-week':''}"></div>`).join('');
      timeline+=cells+placed+`</div>`;
    });
    timeline+='</div></div>';
    const m=d.inspectionSummary.mechanical,e=d.inspectionSummary.electrical;
    const mechPct=(m.passed/m.total*100).toFixed(1);
    const mechSummary=`<div class="summary-grid"><div class="stat"><label>Mechanical TI · Total</label><div class="value">${m.total}</div><small>Inspection checks</small></div><div class="stat good"><label>Mechanical · Passed</label><div class="value">${m.passed}</div><small>${mechPct}% of total checks</small></div><div class="stat bad"><label>Mechanical · Failed</label><div class="value">${m.failed}</div><small>Action required</small></div><div class="stat warn"><label>Mechanical · Remaining</label><div class="value">${m.remaining}</div><small>Not yet recorded as passed or failed</small></div></div><div class="progress-wrap"><span class="progress-green" style="width:${m.passed/m.total*100}%"></span><span class="progress-red" style="width:${m.failed/m.total*100}%"></span><span class="progress-grey" style="width:${m.remaining/m.total*100}%"></span></div>`;
    const elecSummary=`<div class="summary-grid" style="margin-top:12px"><div class="stat info"><label>Electrical TI · Total</label><div class="value">${e.total}</div><small>${e.lowVoltage} low voltage + ${e.highVoltage} high voltage</small></div><div class="stat"><label>Electrical · Passed</label><div class="value">—</div><small>Result split not supplied</small></div><div class="stat"><label>Electrical · Failed</label><div class="value">—</div><small>Result split not supplied</small></div><div class="stat"><label>Electrical · Remaining</label><div class="value">—</div><small>Awaiting logged inspection results</small></div></div>`;
    const tests=d.tests.map(t=>`<tr><td><strong>${t.name}</strong></td><td>${t.unit}</td><td>${t.result}</td><td>${t.target}</td><td class="num">${t.runs}</td><td class="num ok">${t.passes}</td><td class="num fail">${t.fails}</td></tr>`).join('');
    mount.innerHTML=`${head}${meta}<div class="legend">${legend}</div><main id="dashboard"><section id="timeline" class="board"><div class="board-title"><h2>PROJECT WORKSTREAMS & WEEKLY TIMELINE</h2><small>WEEK 12 ACTIVE · TARGET 01 JAN 2027</small></div>${timeline}<p class="notice">${d.page.planningNote}</p></section>
      <section id="summary" class="section"><div class="section-head"><div><h2>Technical inspection status</h2><p>Quick read of Mechanical and Electrical TI results.</p></div><span class="pill">MECHANICAL: ${m.status} · ELECTRICAL: ${e.status}</span></div>${mechSummary}${elecSummary}<p class="small-note">Mechanical remaining = 167 − 55 passed − 9 failed = 103. Electrical TI has 115 recorded checkpoints, but the supplied checklist does not contain a pass/fail tally.</p></section>
      <section id="tests" class="section"><div class="section-head"><div><h2>Vehicle test log</h2><p>Expected outcomes and run counts from the team test guide.</p></div><span class="pill">${d.tests.reduce((n,x)=>n+x.runs,0)} RUNS LOGGED</span></div><div class="data-table-wrap"><table><thead><tr><th>Test</th><th>Unit</th><th>What to record</th><th>Target / pass rule</th><th>Runs</th><th>Pass</th><th>Fail</th></tr></thead><tbody>${tests}</tbody></table></div><p class="small-note">All test run counts currently show 0 in the supplied test guide. Top-speed numerical target has not yet been specified.</p></section>
      <footer class="footer"><span>MOKSHA MOTORSPORTS · ENGINEERING ADMINISTRATION</span><span>DATA SOURCE: admin-dashboard.json</span></footer></main>`;
  }catch(err){mount.innerHTML=`<div class="error"><strong>Dashboard data could not be loaded.</strong><p>${err.message}</p><p>Check that <code>admin-dashboard.html</code> and <code>admin-dashboard.json</code> are in the same folder and open through GitHub Pages or a local web server.</p></div>`;}
})();
</script>
</body>
</html>
